name: lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck + Bats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        run: |
          find . -type f -name "*.sh" -not -path "./tests/*" -exec \
            shellcheck --severity=warning --shell=bash --format=gcc {} +
          echo "ShellCheck ✅"

      - name: Install Bats
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Run Bats tests
        run: |
          bats tests/
          echo "Bats ✅"
