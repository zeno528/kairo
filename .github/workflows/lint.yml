name: lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck + Bats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ShellCheck 0.11.0
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo cp /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/
          shellcheck --version

      - name: Run ShellCheck
        run: |
          find . -type f -name "*.sh" -not -path "./tests/*" -exec \
            shellcheck --severity=warning --shell=bash --format=gcc {} +
          echo "ShellCheck ✅"

      - name: Install Bats
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Run Bats tests
        run: |
          bats tests/
          echo "Bats ✅"

  deploy-sg:
    name: 部署到 sg
    if: github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    environment: sg
    concurrency:
      group: deploy-sg
      cancel-in-progress: false
    permissions:
      deployments: write

    steps:
      - name: 部署 Kairo 到 sg
        env:
          SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SSH_USER: ${{ secrets.SG_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SG_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          curl -fsSL "https://raw.githubusercontent.com/zeno528/kairo/$RELEASE_SHA/install.sh" |
            ssh -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -o IdentitiesOnly=yes \
                -i ~/.ssh/deploy_key \
                "$SSH_USER@$SSH_HOST" \
                "KAIRO_RELEASE_SHA=$RELEASE_SHA bash"
          ssh -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/deploy_key \
              "$SSH_USER@$SSH_HOST" \
              "/usr/local/bin/ka --help >/dev/null && echo 部署验证通过"
